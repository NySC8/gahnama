name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/fonts.sh
      - name: Remove stray non-XML files from res/values
        run: find app/src/main/res/values -type f ! -name '*.xml' -print -delete
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - run: gradle :app:assembleDebug --no-daemon -Pvc=${{ github.run_number }} -Pvn=0.2.${{ github.run_number }}
      - run: cp app/build/outputs/apk/debug/app-debug.apk gahnama.apk
      - uses: actions/upload-artifact@v4
        with: { name: gahnama-apk, path: gahnama.apk }
      - if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.${{ github.run_number }}
          name: گاه‌نما v0.2.${{ github.run_number }}
          files: gahnama.apk
          generate_release_notes: true
          make_latest: true

  site:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/fonts.sh
      - uses: actions/upload-pages-artifact@v3
        with: { path: docs }
      - id: deploy
        uses: actions/deploy-pages@v4
