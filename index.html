<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>گاه‌نما | تقویم مینیمال فارسی</title>
<meta name="description" content="گاه‌نما؛ تقویم روزانهٔ شمسی، میلادی و قمری برای اندروید.">
<meta name="theme-color" content="#285642">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<style>
:root{--p:#285642;--s:#47745B;--bg:#F7F8F3;--card:#fff;--tx:#202B25;--mu:#A7B9A8;--line:#e3e9e1}
@media(prefers-color-scheme:dark){:root{--p:#7FB69A;--bg:#111A15;--card:#18231D;--tx:#E6EDE8;--mu:#5E7568;--line:#223028}}
*{box-sizing:border-box;margin:0}
body{font-family:Vazirmatn,Tahoma,system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.9;text-align:center}
main{max-width:720px;margin:0 auto;padding:64px 20px}
img.logo{width:96px;height:96px;border-radius:24px}
h1{font-size:2.6rem;color:var(--p);margin-top:16px}
.en{color:var(--mu);letter-spacing:.3em;font-size:.8rem}
p.lead{font-size:1.15rem;margin:20px auto 32px;max-width:460px}
.btn{display:inline-block;background:var(--p);color:var(--bg);padding:14px 36px;border-radius:16px;text-decoration:none;font-weight:600}
.btn:hover{opacity:.9}
.note{color:var(--mu);font-size:.85rem;margin-top:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:56px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px}
.card b{display:block;color:var(--p);margin-bottom:4px}
footer{margin-top:56px;color:var(--mu);font-size:.85rem}
</style>
</head>
<body>
<main>
  <img class="logo" src="logo.svg" alt="لوگوی گاه‌نما">
  <h1>گاه‌نما</h1>
  <div class="en">GAHNAMA</div>
  <p class="lead">تاریخ امروز را با یک نگاه ببینید؛ شمسی، میلادی و قمری، ساده و بدون شلوغی.</p>
  <!-- USER را با نام کاربری گیت‌هاب جایگزین کنید -->
  <a class="btn" href="https://github.com/USER/gahnama/releases/latest/download/gahnama.apk">دانلود برای اندروید</a>
  <p class="note">نسخهٔ آزمایشی · اندروید ۸ به بالا</p>
  <div class="grid">
    <div class="card"><b>سه تقویم</b>شمسی، میلادی و قمری</div>
    <div class="card"><b>مینیمال</b>طراحی راست‌چین و تمیز</div>
    <div class="card"><b>آفلاین</b>بدون نیاز به اینترنت</div>
    <div class="card"><b>به‌زودی</b>مناسبت‌ها، اعلان و ویجت</div>
  </div>
  <footer>gahnama.bipolarchat.ir</footer>
</main>
</body>
</html>
